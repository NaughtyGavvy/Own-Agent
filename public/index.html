<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">✦</div>
      <b>NOVA AI</b>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">Recent chats</div>

    <div id="chatHistory"></div>

    <div class="status">
      <span></span> AI Online
    </div>

  </aside>


  <main class="main">

    <header class="topbar">
      <b>NOVA</b>
      <span>AI Agent</span>
    </header>


    <section id="chat" class="chat">

      <div id="welcome" class="welcome">

        <div class="welcome-icon">✦</div>

        <h1>How can I help you?</h1>

        <p>
          Ask NOVA anything. Build, learn, create and explore.
        </p>

        <div class="suggestions">

          <button onclick="useSuggestion('Build me a website')">
            🌐 Build a website
          </button>

          <button onclick="useSuggestion('Explain artificial intelligence simply')">
            🧠 Explain AI
          </button>

          <button onclick="useSuggestion('Help me write a JavaScript program')">
            💻 Write code
          </button>

          <button onclick="useSuggestion('Give me a business idea')">
            💡 Give me an idea
          </button>

        </div>

      </div>

    </section>


    <div class="input-area">

      <div class="input-box">

        <textarea
          id="message"
          placeholder="Message NOVA..."
          rows="1"
        ></textarea>

        <button id="send" onclick="sendMessage()">➤</button>

      </div>

      <small>NOVA can make mistakes. Check important information.</small>

    </div>

  </main>

</div>

<script src="/app.js"></script>

</body>
</html>
